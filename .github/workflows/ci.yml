name: CI

on:
  push:
    branches: [main, "devin/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Syntax check JS files
        run: |
          set -e
          for f in $(find . -path ./node_modules -prune -o -name '*.js' -print | grep -v '^./node_modules'); do
            echo "checking $f"
            node --check "$f"
          done
      - name: Run tests
        run: node --test tests/*.test.mjs
